backend:
  name: github
  repo: TheTravelTaylor/The-travel-taylor
  branch: main

publish_mode: simple
media_folder: "uploads"
public_folder: "/uploads"

editor:
  preview: false

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "homepage.page"
        format: "json"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Homepage kicker", name: "homeKicker", widget: "string"}
          - {label: "Homepage headline", name: "homeHeadline", widget: "string"}
          - {label: "Homepage intro", name: "homeIntro", widget: "text"}

      - name: "about"
        label: "About"
        file: "about.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Body", name: "body", widget: "text"}

      - name: "stay_page"
        label: "STAY landing page"
        file: "stay.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}

      - name: "eat_page"
        label: "EAT / DRINK landing page"
        file: "eat.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}

      - name: "cruise_page"
        label: "CRUISE landing page"
        file: "cruise.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}

  - name: "stay_reviews"
    label: "STAY"
    label_singular: "Review"
    folder: "."
    extension: "article"
    format: "json"
    create: true
    slug: "{{fields.slug}}"
    filter: {field: "section", value: "stay"}
    summary: "{{title}}"
    editor:
      preview: false
    fields:

      - {label: "Section", name: "section", widget: "hidden", default: "stay"}
      - {label: "Display order", name: "order", widget: "number", value_type: "int", default: 999}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Slug", name: "slug", widget: "string", hint: "Lowercase words separated by hyphens. Do not change after publishing unless you also want the article URL to change."}
      - {label: "Location", name: "location", widget: "string"}
      - {label: "Summary", name: "summary", widget: "text"}
      - {label: "Overall score", name: "score", widget: "number", required: false, value_type: "float", min: 0, max: 10, step: 0.5}
      - {label: "Score label", name: "scoreLabel", widget: "string", required: false}
      - {label: "Hero image", name: "hero", widget: "image", required: false}
      - label: "Article"
        name: "body"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.type}} — {{fields.text}}"
        fields:
          - {label: "Type", name: "type", widget: "select", options: ["heading", "paragraph"]}
          - {label: "Text", name: "text", widget: "text"}
      - label: "Scores"
        name: "scores"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.category}} — {{fields.score}}/10"
        fields:
          - {label: "Category", name: "category", widget: "string"}
          - {label: "Score", name: "score", widget: "number", value_type: "float", min: 0, max: 10, step: 0.5}
          - {label: "Comment", name: "comment", widget: "text"}
      - {label: "Overall comment", name: "overall", widget: "text", required: false}
      - {label: "Would I go back?", name: "wouldGoBack", widget: "string", required: false}


  - name: "eat_reviews"
    label: "EAT / DRINK"
    label_singular: "Review"
    folder: "."
    extension: "article"
    format: "json"
    create: true
    slug: "{{fields.slug}}"
