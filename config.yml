backend:
  name: github
  repo: TheTravelTaylor/The-travel-taylor
  branch: main

publish_mode: simple
media_folder: "uploads"
public_folder: "/uploads"

editor:
  preview: false

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "homepage.page"
        format: "json"
        fields:
          - {label: "Name", name: "name", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Homepage kicker", name: "homeKicker", widget: "string"}
          - {label: "Homepage headline", name: "homeHeadline", widget: "string"}
          - {label: "Homepage intro", name: "homeIntro", widget: "text"}
      - name: "about"
        label: "About"
        file: "about.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Body", name: "body", widget: "text"}
      - name: "stay_page"
        label: "STAY landing page"
        file: "stay.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
      - name: "eat_page"
        label: "EAT / DRINK landing page"
        file: "eat.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}
      - name: "cruise_page"
        label: "CRUISE landing page"
        file: "cruise.page"
        format: "json"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Intro", name: "intro", widget: "text"}

  - name: "stay"
    label: "STAY"
    files:
      - name: "the_tawny"
        label: "The Tawny: Bubble Baths, Fizz & Fairy Lights"
        file: "the-tawny.article"
        format: "json"
        fields:

          - {label: "Section", name: "section", widget: "select", options: ["stay", "eat", "cruise"]}
          - {label: "Display order", name: "order", widget: "number", value_type: "int", required: false}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Slug", name: "slug", widget: "string", hint: "Lowercase words separated by hyphens."}
          - {label: "Location", name: "location", widget: "string"}
          - {label: "Summary", name: "summary", widget: "text"}
          - {label: "Overall score", name: "score", widget: "number", required: false, value_type: "float", min: 0, max: 10, step: 0.5}
          - {label: "Score label", name: "scoreLabel", widget: "string", required: false}
          - {label: "Hero image", name: "hero", widget: "image", required: false, hint: "Used on the article card and at the top of the review."}

          - label: "Article"
            name: "body"
            widget: "list"
            required: false
            collapsed: true
            types:
              - label: "Paragraph"
                name: "paragraph"
                widget: "object"
                fields:
                  - {label: "Text", name: "text", widget: "text"}
              - label: "Heading"
                name: "heading"
                widget: "object"
                fields:
                  - {label: "Heading", name: "text", widget: "string"}
              - label: "Full-width photo"
                name: "image"
                widget: "object"
                fields:
                  - {label: "Photo", name: "image", widget: "image"}
                  - {label: "Alt text", name: "alt", widget: "string", required: false, hint: "Briefly describe the photo for accessibility."}
                  - {label: "Caption", name: "caption", widget: "string", required: false}
              - label: "Two-photo layout"
                name: "image_pair"
                widget: "object"
                fields:
                  - {label: "Left photo", name: "image1", widget: "image"}
                  - {label: "Left alt text", name: "alt1", widget: "string", required: false}
                  - {label: "Left caption", name: "caption1", widget: "string", required: false}
                  - {label: "Right photo", name: "image2", widget: "image"}
                  - {label: "Right alt text", name: "alt2", widget: "string", required: false}
                  - {label: "Right caption", name: "caption2", widget: "string", required: false}

          - label: "Scores"
            name: "scores"
            widget: "list"
            required: false
            collapsed: true
            summary: "{{fields.category}} — {{fields.score}}/10"
            fields:
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Score", name: "score", widget: "number", value_type: "float", min: 0, max: 10, step: 0.5}
              - {label: "Comment", name: "comment", widget: "text"}
          - {label: "Overall comment", name: "overall", widget: "text", required: false}
          - {label: "Would I go back?", name: "wouldGoBack", widget: "string", required: false}

